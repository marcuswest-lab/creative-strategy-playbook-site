<svg xmlns="http://www.w3.org/2000/svg" width="2720" height="2320" viewBox="0 0 2720 2320" role="img" aria-labelledby="title desc"><title id="title">Ad next-step flowchart</title><desc id="desc">Winner leads to the iteration workflow: choose highest-leverage tests first and keep winning elements fixed. Branch first into vertical scaling (execution or messaging) and horizontal scaling (persona or awareness, adapted through messaging, execution, or offer). An underperformer worth investigating leads to Stefan’s diagnostic process.</desc><style>a text{fill:#176b60;text-decoration:underline}a:hover text{fill:#0a493f}a:focus{outline:3px solid #176b60}</style><g font-family="Arial,sans-serif" fill="#19313d"><rect x="700" y="20" width="400" height="64" rx="12" fill="#fff" stroke="#b5c8c0"/><text x="900" y="59" font-size="26" font-weight="600" text-anchor="middle">Ad: what next?</text><path d="M900 84V112H680V140 M674 132L680 140L686 132" fill="none" stroke="#81998e" stroke-width="2"/><path d="M900 112H1570V140 M1564 132L1570 140L1576 132" fill="none" stroke="#81998e" stroke-width="2"/><rect x="500" y="140" width="360" height="60" rx="12" fill="#e9f3ed" stroke="#b5c8c0"/><text x="680" y="178" font-size="25" font-weight="600" text-anchor="middle">Winner</text><rect x="1380" y="140" width="380" height="80" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1570" y="173" font-size="24" font-weight="600" text-anchor="middle">Underperformer</text><text x="1570" y="202" font-size="24" font-weight="600" text-anchor="middle">worth investigating</text><path d="M680 200V240 M674 232L680 240L686 232" fill="none" stroke="#81998e" stroke-width="2"/><path d="M1570 220V260 M1564 252L1570 260L1576 252" fill="none" stroke="#81998e" stroke-width="2"/><rect x="350" y="240" width="660" height="145" rx="12" fill="#e9f3ed" stroke="#b5c8c0"/><text x="680" y="274" font-size="26" font-weight="600" text-anchor="middle">Winner iteration workflow</text><text x="680" y="305" font-size="22" font-weight="400" text-anchor="middle">Choose the highest-leverage tests first</text><text x="680" y="333" font-size="22" font-weight="400" text-anchor="middle">Keep the winning elements fixed</text><a href="Original%20Playbook.html#iterations-complete-winner-iteration-workflow" target="_top"><text x="555" y="365" font-size="19" font-weight="400" text-anchor="start">Winner iteration workflow →</text></a><rect x="1380" y="260" width="600" height="150" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1400" y="294" font-size="25" font-weight="600" text-anchor="start">One ad, or a broader decline?</text><text x="1400" y="326" font-size="21" font-weight="400" text-anchor="start">Is other stuff still working in the account?</text><text x="1400" y="355" font-size="19" font-weight="400" text-anchor="start">Compare established controls and distinct concepts.</text><text x="1400" y="384" font-size="18" font-weight="400" text-anchor="start">Account-wide does not automatically mean market-wide.</text><path d="M1570 410V510 M1564 502L1570 510L1576 502" fill="none" stroke="#81998e" stroke-width="2"/><text x="1390" y="452" font-size="19" font-weight="500" text-anchor="start">One-off / other ads still working</text><path d="M1980 335H2070 M2062 329L2070 335L2062 341" fill="none" stroke="#81998e" stroke-width="2"/><text x="2085" y="244" font-size="21" font-weight="600" text-anchor="start">Broader decline / possible macro trend</text><rect x="2070" y="260" width="630" height="240" rx="12" fill="#e3edf7" stroke="#b5c8c0"/><text x="2090" y="294" font-size="24" font-weight="600" text-anchor="start">Nick’s TAM / sophistication review</text><text x="2090" y="329" font-size="20" font-weight="400" text-anchor="start">Has the market heard this claim before?</text><text x="2090" y="359" font-size="20" font-weight="400" text-anchor="start">Is the hook recycled or too narrow?</text><text x="2090" y="389" font-size="20" font-weight="400" text-anchor="start">Does the first frame look like every other ad?</text><text x="2090" y="419" font-size="20" font-weight="400" text-anchor="start">Buyer relevance + curiosity + implied benefit</text><a href="Original%20Playbook.html#hooks-account-wide-decline-tam-and-market-sophistication" target="_top"><text x="2090" y="466" font-size="19" font-weight="400" text-anchor="start">Nick: TAM / sophistication →</text></a><g transform="translate(0,250)"><rect x="1380" y="260" width="380" height="92" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1570" y="294" font-size="23" font-weight="600" text-anchor="middle">Stefan’s diagnostic process</text><a href="Original%20Playbook.html#diagnostics-five-diagnostic-checks" target="_top"><text x="1405" y="330" font-size="19" font-weight="400" text-anchor="start">Stefan’s diagnostic process →</text></a><rect x="1380" y="380" width="600" height="64" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1680" y="419" font-size="24" font-weight="600" text-anchor="middle">Ad Underperforms / Fails</text><path d="M1570 352V380 M1564 372L1570 380L1576 372" fill="none" stroke="#81998e" stroke-width="2"/><path d="M1680 444V500 M1674 492L1680 500L1686 492" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1380" y="500" width="600" height="90" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1400" y="550" font-size="24" font-weight="600" text-anchor="start">Step 1: Format &amp; Demo Congruence</text><path d="M1980 533H2180 M2172 527L2180 533L2172 539" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1990" y="463" width="440" height="32" rx="12" fill="#f5f7f6" stroke="#b5c8c0"/><text x="2000" y="486" font-size="19" font-weight="500" text-anchor="start">Incongruent?</text><rect x="2180" y="507" width="260" height="60" rx="12" fill="#f7eee9" stroke="#b5c8c0"/><text x="2192" y="532" font-size="18" font-weight="400" text-anchor="start">Re-pair format with audience</text><path d="M1680 590V720 M1674 712L1680 720L1686 712" fill="none" stroke="#81998e" stroke-width="2"/><text x="1693" y="692" font-size="19" font-weight="500" text-anchor="start">Congruent / Proven</text><rect x="1380" y="720" width="600" height="90" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1400" y="770" font-size="24" font-weight="600" text-anchor="start">Step 2: Creative Execution &amp; Production</text><path d="M1980 753H2180 M2172 747L2180 753L2172 759" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1990" y="683" width="440" height="32" rx="12" fill="#f5f7f6" stroke="#b5c8c0"/><text x="2000" y="706" font-size="19" font-weight="500" text-anchor="start">Flawed Edit / Failed &quot;FU Test&quot;?</text><rect x="2180" y="727" width="260" height="60" rx="12" fill="#f7eee9" stroke="#b5c8c0"/><text x="2192" y="752" font-size="18" font-weight="400" text-anchor="start">Re-edit / Fix pacing</text><path d="M1680 810V940 M1674 932L1680 940L1686 932" fill="none" stroke="#81998e" stroke-width="2"/><text x="1693" y="912" font-size="19" font-weight="500" text-anchor="start">Clean Execution</text><rect x="1380" y="940" width="600" height="90" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1400" y="990" font-size="24" font-weight="600" text-anchor="start">Step 3: Angle &amp; Hook Track Record</text><path d="M1680 1030V1090H1590V1140 M1584 1132L1590 1140L1596 1132" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1380" y="1140" width="420" height="380" rx="12" fill="#f7eee9" stroke="#b5c8c0"/><text x="1396" y="1169" font-size="23" font-weight="600" text-anchor="start">Proven Angle</text><text x="1396" y="1200" font-size="18" font-weight="600" text-anchor="start">Historical Context</text><text x="1396" y="1225" font-size="18" font-weight="400" text-anchor="start">Has converted previously in this account</text><text x="1396" y="1263" font-size="18" font-weight="600" text-anchor="start">Diagnostic Rule</text><text x="1396" y="1288" font-size="18" font-weight="400" text-anchor="start">Likely a weak hook variation, fatigued</text><text x="1396" y="1312" font-size="18" font-weight="400" text-anchor="start">delivery, or bad lead</text><text x="1396" y="1350" font-size="18" font-weight="600" text-anchor="start">Action to Take</text><text x="1396" y="1375" font-size="18" font-weight="400" text-anchor="start">Test 4–10 micro-hook variations or test</text><text x="1396" y="1399" font-size="18" font-weight="400" text-anchor="start">across alternate proven formats.</text><path d="M1680 1030V1090H2040V1140 M2034 1132L2040 1140L2046 1132" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1830" y="1140" width="420" height="380" rx="12" fill="#f7eee9" stroke="#b5c8c0"/><text x="1846" y="1169" font-size="23" font-weight="600" text-anchor="start">Novel / New Angle</text><text x="1846" y="1200" font-size="18" font-weight="600" text-anchor="start">Historical Context</text><text x="1846" y="1225" font-size="18" font-weight="400" text-anchor="start">Tested only 1–2 times and failed</text><text x="1846" y="1263" font-size="18" font-weight="600" text-anchor="start">Diagnostic Rule</text><text x="1846" y="1288" font-size="18" font-weight="400" text-anchor="start">Inconclusive — 1 to 2 failures do not provide</text><text x="1846" y="1312" font-size="18" font-weight="400" text-anchor="start">sufficient statistical or creative data</text><text x="1846" y="1350" font-size="18" font-weight="600" text-anchor="start">Action to Take</text><text x="1846" y="1375" font-size="18" font-weight="400" text-anchor="start">Do not kill prematurely. If you have</text><text x="1846" y="1399" font-size="18" font-weight="400" text-anchor="start">conviction, change the format, the opening</text><text x="1846" y="1423" font-size="18" font-weight="400" text-anchor="start">situation, or the lead copy.</text><path d="M1680 1030V1090H2490V1140 M2484 1132L2490 1140L2496 1132" fill="none" stroke="#81998e" stroke-width="2"/><rect x="2280" y="1140" width="420" height="380" rx="12" fill="#f7eee9" stroke="#b5c8c0"/><text x="2296" y="1169" font-size="23" font-weight="600" text-anchor="start">Exhausted Angle</text><text x="2296" y="1200" font-size="18" font-weight="600" text-anchor="start">Historical Context</text><text x="2296" y="1225" font-size="18" font-weight="400" text-anchor="start">Tested repeatedly over several months across</text><text x="2296" y="1249" font-size="18" font-weight="400" text-anchor="start">multiple formats/hooks with zero traction</text><text x="2296" y="1287" font-size="18" font-weight="600" text-anchor="start">Diagnostic Rule</text><text x="2296" y="1312" font-size="18" font-weight="400" text-anchor="start">Hypothesis is likely invalid for this</text><text x="2296" y="1336" font-size="18" font-weight="400" text-anchor="start">account/audience</text><text x="2296" y="1374" font-size="18" font-weight="600" text-anchor="start">Action to Take</text><text x="2296" y="1399" font-size="18" font-weight="400" text-anchor="start">Kill the angle entirely, or cap it strictly</text><text x="2296" y="1423" font-size="18" font-weight="400" text-anchor="start">at 1 in 30 creatives per batch to avoid</text><text x="2296" y="1447" font-size="18" font-weight="400" text-anchor="start">wasting production bandwidth.</text><path d="M1590 1520V1600H2040V1520 M1680 1600V1690 M1674 1682L1680 1690L1686 1682" fill="none" stroke="#81998e" stroke-width="2" stroke-dasharray="6 5"/><text x="1700" y="1630" font-size="19" font-weight="500" text-anchor="start">Check external evidence if needed</text><text x="1700" y="1657" font-size="17" font-weight="400" text-anchor="start">Dotted routing = playbook interpretation</text><text x="2490" y="1552" font-size="18" font-weight="500" text-anchor="middle">End of this diagnostic branch</text><rect x="1380" y="1690" width="600" height="90" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1400" y="1740" font-size="24" font-weight="600" text-anchor="start">Step 4: Market / Competitor Validation</text><path d="M1980 1723H2180 M2172 1717L2180 1723L2172 1729" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1990" y="1653" width="440" height="32" rx="12" fill="#f5f7f6" stroke="#b5c8c0"/><text x="2000" y="1676" font-size="19" font-weight="500" text-anchor="start">Scaling elsewhere?</text><rect x="2180" y="1697" width="260" height="60" rx="12" fill="#f7eee9" stroke="#b5c8c0"/><text x="2192" y="1722" font-size="18" font-weight="400" text-anchor="start">Angle valid; rethink entry</text><path d="M1680 1780V1910 M1674 1902L1680 1910L1686 1902" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1380" y="1910" width="600" height="90" rx="12" fill="#fff3df" stroke="#b5c8c0"/><text x="1400" y="1960" font-size="24" font-weight="600" text-anchor="start">Step 5: Portfolio Allocation (80/20 Rule)</text><path d="M1980 1943H2180 M2172 1937L2180 1943L2172 1949" fill="none" stroke="#81998e" stroke-width="2"/><rect x="2180" y="1917" width="260" height="60" rx="12" fill="#f7eee9" stroke="#b5c8c0"/><text x="2192" y="1942" font-size="18" font-weight="400" text-anchor="start">Re-balance proven vs.</text><text x="2192" y="1965" font-size="18" font-weight="400" text-anchor="start">experimental swings</text></g><path d="M680 385V420H340V455 M334 447L340 455L346 447" fill="none" stroke="#81998e" stroke-width="2"/><path d="M680 420H1020V455 M1014 447L1020 455L1026 447" fill="none" stroke="#81998e" stroke-width="2"/><rect x="150" y="455" width="380" height="70" rx="12" fill="#dceee3" stroke="#b5c8c0"/><text x="340" y="497" font-size="25" font-weight="600" text-anchor="middle">Vertical scaling</text><rect x="830" y="455" width="380" height="70" rx="12" fill="#e3edf7" stroke="#b5c8c0"/><text x="1020" y="497" font-size="25" font-weight="600" text-anchor="middle">Horizontal scaling</text><path d="M340 525V555H175V590 M169 582L175 590L181 582" fill="none" stroke="#81998e" stroke-width="2"/><path d="M340 555H505V590 M499 582L505 590L511 582" fill="none" stroke="#81998e" stroke-width="2"/><rect x="20" y="590" width="310" height="365" rx="12" fill="#edf5f0" stroke="#b5c8c0"/><text x="40" y="630" font-size="23" font-weight="600" text-anchor="start">Format / style / execution</text><text x="40" y="675" font-size="20" font-weight="400" text-anchor="start">Viral hook / pattern interrupt</text><text x="40" y="713" font-size="20" font-weight="400" text-anchor="start">First frame / delivery</text><text x="40" y="751" font-size="20" font-weight="400" text-anchor="start">Static visual treatment</text><text x="40" y="789" font-size="20" font-weight="400" text-anchor="start">UGC location / actor</text><text x="40" y="827" font-size="20" font-weight="400" text-anchor="start">Different format</text><a href="Original%20Playbook.html#formats" target="_top"><text x="40" y="895" font-size="19" font-weight="400" text-anchor="start">Format Bank →</text></a><a href="Original%20Playbook.html#hooks" target="_top"><text x="40" y="932" font-size="19" font-weight="400" text-anchor="start">Hook Bank →</text></a><rect x="350" y="590" width="310" height="365" rx="12" fill="#edf5f0" stroke="#b5c8c0"/><text x="370" y="630" font-size="24" font-weight="600" text-anchor="start">Messaging</text><text x="370" y="675" font-size="20" font-weight="400" text-anchor="start">Opening words / headline</text><text x="370" y="713" font-size="20" font-weight="400" text-anchor="start">Wording / angle</text><text x="370" y="751" font-size="20" font-weight="400" text-anchor="start">Proof / objections</text><text x="370" y="789" font-size="20" font-weight="400" text-anchor="start">Body copy / CTA</text><a href="Original%20Playbook.html#hooks" target="_top"><text x="370" y="895" font-size="19" font-weight="400" text-anchor="start">Hook Bank →</text></a><path d="M1020 525V555H855V590 M849 582L855 590L861 582" fill="none" stroke="#81998e" stroke-width="2"/><path d="M1020 555H1185V590 M1179 582L1185 590L1191 582" fill="none" stroke="#81998e" stroke-width="2"/><rect x="710" y="590" width="290" height="70" rx="12" fill="#e3edf7" stroke="#b5c8c0"/><text x="855" y="633" font-size="24" font-weight="600" text-anchor="middle">Persona</text><path d="M855 660V700 M849 692L855 700L861 692" fill="none" stroke="#81998e" stroke-width="2"/><rect x="710" y="700" width="290" height="355" rx="12" fill="#f0f5fa" stroke="#b5c8c0"/><text x="730" y="738" font-size="22" font-weight="600" text-anchor="start">Adapt through:</text><a href="Original%20Playbook.html#hooks" target="_top"><text x="730" y="803" font-size="19" font-weight="400" text-anchor="start">Hook Bank →</text></a><a href="Original%20Playbook.html#formats" target="_top"><text x="730" y="867" font-size="19" font-weight="400" text-anchor="start">Format Bank →</text></a><a href="Original%20Playbook.html#strategy-when-to-expand-the-offer-or-funnel" target="_top"><text x="730" y="931" font-size="19" font-weight="400" text-anchor="start">Offer / funnel expansion →</text></a><text x="730" y="970" font-size="18" font-weight="600" text-anchor="start">Planning and writing:</text><a href="Original%20Playbook.html#strategy-hernan-vazquez-avatar-awareness-matrix" target="_top"><text x="730" y="1002" font-size="19" font-weight="400" text-anchor="start">Hernan’s avatar matrix →</text></a><a href="Original%20Playbook.html#narrative" target="_top"><text x="730" y="1034" font-size="19" font-weight="400" text-anchor="start">Narrative ads workflow →</text></a><text x="730" y="780" font-size="19" font-weight="400" text-anchor="start">Messaging: callout / banner</text><text x="730" y="844" font-size="19" font-weight="400" text-anchor="start">Format / style / execution</text><text x="730" y="908" font-size="19" font-weight="400" text-anchor="start">Offer / conversion path</text><rect x="1040" y="590" width="290" height="70" rx="12" fill="#e3edf7" stroke="#b5c8c0"/><text x="1185" y="633" font-size="24" font-weight="600" text-anchor="middle">Level of awareness</text><path d="M1185 660V700 M1179 692L1185 700L1191 692" fill="none" stroke="#81998e" stroke-width="2"/><rect x="1040" y="700" width="290" height="390" rx="12" fill="#f0f5fa" stroke="#b5c8c0"/><text x="1060" y="738" font-size="22" font-weight="600" text-anchor="start">Adapt through:</text><a href="Original%20Playbook.html#hooks" target="_top"><text x="1060" y="803" font-size="19" font-weight="400" text-anchor="start">Hook Bank →</text></a><a href="Original%20Playbook.html#formats" target="_top"><text x="1060" y="867" font-size="19" font-weight="400" text-anchor="start">Format Bank →</text></a><a href="Original%20Playbook.html#strategy-when-to-expand-the-offer-or-funnel" target="_top"><text x="1060" y="931" font-size="19" font-weight="400" text-anchor="start">Offer / funnel expansion →</text></a><text x="1060" y="970" font-size="18" font-weight="600" text-anchor="start">Planning and writing:</text><a href="Original%20Playbook.html#strategy-hernan-vazquez-avatar-awareness-matrix" target="_top"><text x="1060" y="1002" font-size="19" font-weight="400" text-anchor="start">Hernan’s avatar matrix →</text></a><a href="Original%20Playbook.html#narrative" target="_top"><text x="1060" y="1034" font-size="19" font-weight="400" text-anchor="start">Narrative ads workflow →</text></a><a href="Original%20Playbook.html#strategy-writing-for-unaware-and-less-aware-audiences" target="_top"><text x="1060" y="1066" font-size="19" font-weight="400" text-anchor="start">Unaware audiences →</text></a><text x="1060" y="780" font-size="19" font-weight="400" text-anchor="start">Messaging</text><text x="1060" y="844" font-size="19" font-weight="400" text-anchor="start">Format / style / execution</text><text x="1060" y="908" font-size="19" font-weight="400" text-anchor="start">Offer / conversion path</text><text x="1020" y="1135" font-size="19" font-weight="400" text-anchor="middle">Persona and awareness can use any of these changes.</text><text x="1020" y="1163" font-size="18" font-weight="400" text-anchor="middle">Offer changes can reach more TOF awareness or a larger market.</text></g></svg>